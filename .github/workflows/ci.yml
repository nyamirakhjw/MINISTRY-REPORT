name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  verify:
    name: Lint, types, unit tests, checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:content
      - run: npm run check:i18n
      - name: Build (bundle and source-map checks follow)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
          RATE_LIMIT_SALT: ci-placeholder-salt-value-32-characters
      - run: npm run check:bundles

  database:
    name: Database rules (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x edge-runtime,imgproxy,studio,logflare,vector,mailpit,inbucket
      - run: supabase db reset
      - run: supabase test db

  e2e:
    name: End to end and accessibility
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      - run: supabase start -x edge-runtime,imgproxy,studio,logflare,vector
      - name: Export local keys
        run: |
          supabase status -o env > /tmp/supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2 | tr -d '\"')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2 | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2 | tr -d '\"')" >> $GITHUB_ENV
          echo "RATE_LIMIT_SALT=ci-salt-$(date +%s)-padding-padding" >> $GITHUB_ENV
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env: { NEXT_PUBLIC_SITE_URL: "http://localhost:3000" }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report }
